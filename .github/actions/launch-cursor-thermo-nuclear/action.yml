name: Launch Cursor thermo-nuclear review
description: Start a read-only Cursor Cloud Agent review, or send an Autopilot follow-up

inputs:
  command:
    description: launch (default) or autopilot
    required: false
    default: launch

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: Install launcher
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci

    - name: Run thermo-nuclear command
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        case "${{ inputs.command }}" in
          autopilot)
            npx tsx cursor-thermo-nuclear-autopilot.ts
            ;;
          launch|"")
            npx tsx cursor-thermo-nuclear-review.ts
            ;;
          *)
            echo "Unknown command: ${{ inputs.command }}" >&2
            exit 1
            ;;
        esac
